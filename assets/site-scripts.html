<script>
// "featured" is an internal tag (it picks the homepage projects). Hide it from cards and category lists.
document.addEventListener("DOMContentLoaded", function () {
  const hide = (el) => { if (el && el.textContent.trim().toLowerCase().startsWith("featured")) el.style.display = "none"; };
  document.querySelectorAll(".listing-category, .quarto-category, .quarto-listing-category .category").forEach(hide);
});
</script>
